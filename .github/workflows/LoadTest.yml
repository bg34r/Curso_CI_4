name: Load Test

on:
  workflow_call:

jobs:

  loadtest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Configurando credenciais AWS
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.ID_CHAVE_ACESSO }}
        aws-secret-access-key: ${{ secrets.CHAVE_SECRETA }}
        aws-region: us-east-2

    - run: git clone https://github.com/bg34r/Infra_Curso_CI.git

    - name: HashiCorp - Setup Terraform
  # You may pin to the exact commit or the version.
  # uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1
      uses: hashicorp/setup-terraform@v2.0.3

    - run: terraform -chdir=Infra_Curso_CI/env/Homolog init

    - run: terraform -chdir=Infra_Curso_CI/env/Homolog destroy -auto-approve

    - run: terraform -chdir=Infra_Curso_CI/env/Homolog apply -auto-approve

    - run: echo "$(terraform -chdir=Infra_Curso_CI/env/Homolog output -raw IP_alb)"
      id: URL

    - name: Setup Python
      uses: actions/setup-python@v5.6.0
      with:
    # Version range or exact version of Python or PyPy to use, using SemVer's version range syntax. Reads from .python-version if unset.
        python-version: 3.10
   
    - uses: BSFishy/pip-action@v1
      with:
        packages: |
          locust

    - name: File Locust
      run: |
        echo "from locust import HttpUser, TaskSet, task, between" >> locustfile.py
        echo "" >> locustfile.py
        echo "class UserTasks(TaskSet):" >> locustfile.py
        echo "	@task(1) " >> locustfile.py
        echo "	def index(self):" >> locustfile.py
        echo "		self.client.get("/bruno")" >> locustfile.py
        echo "" >> locustfile.py
        echo "class WebsiteUser(HttpUser):" >> locustfile.py
        echo "	tasks = [UserTasks]" >> locustfile.py
        echo "	wait_time = between(1, 5)" >> locustfile.py

    - name: Roda teste de carga
      run: sleep 60s ; locust -f locustfile.py --headless -u 10 -r 5 --run-time 60s -H http://${{ steps.URL.outputs.stdout }}
    