name: Load Test

on:
  workflow_call:

jobs:

  loadtest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Configurando credenciais AWS
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.ID_CHAVE_ACESSO }}
        aws-secret-access-key: ${{ secrets.CHAVE_SECRETA }}
        aws-region: us-east-2

    - run: git clone https://github.com/bg34r/Infra_Curso_CI.git

    - name: HashiCorp - Setup Terraform
  # You may pin to the exact commit or the version.
  # uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1
      uses: hashicorp/setup-terraform@v2.0.3

    - run: terraform -chdir=Infra_Curso_CI/env/Homolog init

    - run: terraform -chdir=Infra_Curso_CI/env/Homolog apply -auto-approve

    - run: echo "$(terraform -chdir=Infra_Curso_CI/env/Homolog output -raw IP_alb)"
    